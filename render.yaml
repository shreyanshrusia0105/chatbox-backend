services:
  - name: chatbox-backend
    type: web
    env: python
    region: oregon  # Choose your preferred region
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app:app --host 0.0.0.0 --port 10000"
    autoDeploy: true
    healthCheckPath: "/"
    envVars:
      - key: PORT
        value: 10000

